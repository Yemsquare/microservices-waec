# Compose creates a private network; services resolve one another by service name.
services:
  catalog:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
  orders:
    build:
      context: .
      dockerfile: src/OrdersService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Docker DNS resolves 'catalog' to the Catalog container.
      Catalog__BaseUrl: http://catalog:8080
    ports:
      - "8082:8080"
    depends_on:
      - catalog
  gateway:
    build:
      context: .
      dockerfile: src/ExamGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__catalog__Destinations__destination1__Address: http://catalog:8080/
      ReverseProxy__Clusters__orders__Destinations__destination1__Address: http://orders:8080/
    ports:
      - "8080:8080"
    depends_on:
      - catalog
      - orders
