# Secrets are loaded from the untracked root .env file.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: [waec-sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Auth: "Server=sqlserver,1433;Database=WaecAuth;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: ${JWT_ISSUER:-Waec.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-Waec.Api}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports: ["8084:8080"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  studentservice:
    build:
      context: .
      dockerfile: src/Services/StudentService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__StudentDatabase: "Server=sqlserver,1433;Database=WaecStudentDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    ports: ["8085:8080"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports: ["8081:8080"]
    restart: unless-stopped

  orders:
    build:
      context: .
      dockerfile: src/OrdersService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Catalog__BaseUrl: http://catalog:8080
    ports: ["8082:8080"]
    depends_on: [catalog]
    restart: unless-stopped

  registration:
    build:
      context: .
      dockerfile: src/RegistrationService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Registrations: "Server=sqlserver,1433;Database=WaecRegistrations;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    ports: ["8083:8080"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: src/NotificationWorker/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/ExamGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: ${JWT_ISSUER:-Waec.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-Waec.Api}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      ReverseProxy__Clusters__auth__Destinations__destination1__Address: http://auth:8080/
      ReverseProxy__Clusters__student__Destinations__destination1__Address: http://studentservice:8080/
      ReverseProxy__Clusters__catalog__Destinations__destination1__Address: http://catalog:8080/
      ReverseProxy__Clusters__orders__Destinations__destination1__Address: http://orders:8080/
      ReverseProxy__Clusters__registration__Destinations__destination1__Address: http://registration:8080/
    ports: ["8080:8080"]
    depends_on: [auth, studentservice, catalog, orders, registration]
    restart: unless-stopped

volumes:
  waec-sql-data:
