# Services communicate over the private Compose network. The gateway is the intended public API entry point.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - waec-sql-data:/var/opt/mssql
  
  student:
    build:
      context: .
      dockerfile: src/StudentServices/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Students: "Server=sqlserver,1433;Database=WaecStudents;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8085:8080"
    depends_on:
      sqlserver:
        condition: service_started
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  auth:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Auth: "Server=sqlserver,1433;Database=WaecAuth;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS}
      BootstrapAdmin__Email: ${ADMIN_EMAIL}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD}
    ports:
      - "8084:8080"
    depends_on:
      sqlserver:
        condition: service_started
    restart: unless-stopped
  catalog:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
  orders:
    build:
      context: .
      dockerfile: src/OrdersService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Catalog__BaseUrl: http://catalog:8080
    ports:
      - "8082:8080"
    depends_on:
      - catalog
  registration:
    build:
      context: .
      dockerfile: src/RegistrationService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Registrations: "Server=sqlserver,1433;Database=WaecRegistrations;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASSWORD}
    ports:
      - "8083:8080"
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  notification-worker:
    build:
      context: .
      dockerfile: src/NotificationWorker/Dockerfile
    environment:
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: src/ExamGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      ReverseProxy__Clusters__auth__Destinations__destination1__Address: http://auth:8080/
      ReverseProxy__Clusters__catalog__Destinations__destination1__Address: http://catalog:8080/
      ReverseProxy__Clusters__orders__Destinations__destination1__Address: http://orders:8080/
      ReverseProxy__Clusters__registration__Destinations__destination1__Address: http://registration:8080/
      ReverseProxy__Clusters__student__Destinations__destination1__Address: http://student:8080/
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - catalog
      - orders
      - registration
      - student

volumes:
  waec-sql-data:
