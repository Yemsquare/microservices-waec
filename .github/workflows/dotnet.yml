name: .NET build and integration tests

on:
  push:
    branches: [ master, main, feature/auth-rbac, feature/unified-student-service ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build services
        run: |
          dotnet build src/AuthService/AuthService.csproj --configuration Release
          dotnet build src/CatalogService/CatalogService.csproj --configuration Release
          dotnet build src/OrdersService/OrdersService.csproj --configuration Release
          dotnet build src/ExamGateway/ExamGateway.csproj --configuration Release
          dotnet build src/RegistrationService/RegistrationService.csproj --configuration Release
          dotnet build src/NotificationWorker/NotificationWorker.csproj --configuration Release
          dotnet build src/Services/StudentService/StudentService.csproj --configuration Release

      - name: Create ephemeral CI secrets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "MSSQL_SA_PASSWORD=$(openssl rand -hex 24)Aa1!"
            echo "JWT_KEY=$(openssl rand -hex 32)"
            echo "JWT_ISSUER=Waec.Auth"
            echo "JWT_AUDIENCE=Waec.Api"
            echo "JWT_ACCESS_TOKEN_MINUTES=30"
            echo "JWT_REFRESH_TOKEN_DAYS=7"
            echo "ADMIN_EMAIL=admin@waec-training.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)Aa1!"
            echo "RABBITMQ_DEFAULT_USER=waec"
            echo "RABBITMQ_DEFAULT_PASS=$(openssl rand -hex 24)"
          } > .env
          {
            grep -v '^MSSQL_SA_PASSWORD=' .env
            grep '^MSSQL_SA_PASSWORD=' .env
          } >> "$GITHUB_ENV"
          echo "GATEWAY_BASE_URL=http://localhost:8080/" >> "$GITHUB_ENV"
          echo "RABBITMQ_MANAGEMENT_URL=http://localhost:15672/" >> "$GITHUB_ENV"
          grep '^RABBITMQ_DEFAULT_USER=' .env | sed 's/^RABBITMQ_DEFAULT_USER=/RABBITMQ_USER=/' >> "$GITHUB_ENV"
          grep '^RABBITMQ_DEFAULT_PASS=' .env | sed 's/^RABBITMQ_DEFAULT_PASS=/RABBITMQ_PASSWORD=/' >> "$GITHUB_ENV"

      - name: Start the Docker Compose environment
        run: docker compose up -d --build

      - name: Wait for service readiness
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "http://localhost:8080/health"
            "http://localhost:8081/health"
            "http://localhost:8082/health"
            "http://localhost:8083/health"
            "http://localhost:8084/health"
            "http://localhost:8085/health"
          )
          for endpoint in "${endpoints[@]}"; do
            ready=false
            for attempt in {1..90}; do
              if curl --fail --silent "$endpoint" >/dev/null; then
                ready=true
                echo "Ready: $endpoint"
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Timed out waiting for $endpoint"
              docker compose ps
              exit 1
            fi
          done

          rabbit_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --user "$RABBITMQ_USER:$RABBITMQ_PASSWORD" http://localhost:15672/api/overview >/dev/null; then
              rabbit_ready=true
              echo "Ready: RabbitMQ management API"
              break
            fi
            sleep 2
          done
          if [ "$rabbit_ready" != true ]; then
            echo "Timed out waiting for RabbitMQ management API"
            docker compose ps
            exit 1
          fi

      - name: Run automated integration tests
        run: dotnet test tests/Waec.IntegrationTests/Waec.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Upload test results and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waec-integration-test-results
          path: |
            **/TestResults/*.trx
            docker-compose-logs.txt
          if-no-files-found: warn

      - name: Stop Docker Compose environment
        if: always()
        run: docker compose down -v
